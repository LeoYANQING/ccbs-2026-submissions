name: Auto-merge student submissions

# Checks that a pull request only touches submission paths, then merges it, then
# rebuilds the teaching roster.
#
# Runs on pull_request_target so that pull requests from forks get a token with
# write access. The validate-and-merge job checks out ONLY the trusted base commit
# that contains tools/validate_submission.cjs. Student files are read as data
# through the API and are NEVER checked out or executed.
# Do not add a checkout of github.event.pull_request.head to this job.
#
# The roster rebuild lives here rather than in roster.yml because a merge performed
# with GITHUB_TOKEN does not trigger a new `push` workflow run.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-and-merge:
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.gate.outputs.merged }}
    steps:
      - name: Check out the trusted validator from the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Test the trusted validator
        run: node --test tools/test_validate_submission.cjs
      - name: Validate the changed files, then merge
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const guard = require(
              `${process.env.GITHUB_WORKSPACE}/tools/validate_submission.cjs`
            );
            await guard.run({ github, context, core });

  roster:
    needs: check-and-merge
    if: needs.check-and-merge.outputs.merged == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: roster
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild ROSTER.md and push if it changed
        run: |
          set -euo pipefail
          git config user.name  "ccbs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 tools/build_roster.py
            if git diff --quiet -- signup/ROSTER.md; then
              echo "roster unchanged"
              exit 0
            fi
            git add signup/ROSTER.md
            git commit -m "Rebuild teaching roster"
            if git push origin HEAD:main; then
              echo "roster pushed on attempt $attempt"
              exit 0
            fi
            echo "push raced, retrying"
          done
          echo "could not push the roster after 3 attempts" >&2
          exit 1
